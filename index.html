<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Vault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grid"></div>
<canvas id="bg"></canvas>

<!-- 🔐 LOGIN -->
<div id="login" class="login">
  <div class="login-inner">

    <h1>🔐 Secure Vault</h1>
    <p class="sub">Enter your master password to continue</p>

    <input id="masterKey" type="password" placeholder="Master Password">

    <button onclick="unlock()">Unlock Vault 🚀</button>

    <p class="reset" onclick="resetMaster()">
      Forgot password? Reset Vault ⚠️
    </p>

  </div>
</div>

<!-- 📦 APP -->
<div id="app" class="hidden app">

  <header>
    <h1>Secure Vault</h1>
    <input id="search" placeholder="Search..." oninput="render()">
  </header>

  <section class="panel">

    <input id="site" placeholder="Website">
    <input id="user" placeholder="Username">
    <input id="pass" placeholder="Password" oninput="checkStrength()">

    <!-- 🔐 GENERATOR -->
    <div class="generator">

      <label>Length: <span id="lenVal">14</span></label>
      <input type="range" id="length" min="6" max="32" value="14" oninput="updateLen()">

      <div class="options">
        <label><input type="checkbox" id="upper" checked> A-Z</label>
        <label><input type="checkbox" id="lower" checked> a-z</label>
        <label><input type="checkbox" id="num" checked> 0-9</label>
        <label><input type="checkbox" id="sym" checked> @#$%</label>
      </div>

    </div>

    <div id="strength" class="strength">Strength: -</div>

    <div class="row">
      <button onclick="gen()">Generate</button>
      <button onclick="copyPass()">Copy</button>
      <button onclick="save()">Save</button>
    </div>

  </section>

  <div id="list"></div>

</div>

<script src="app.js"></script>
</body>
</html>
